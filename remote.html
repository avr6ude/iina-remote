<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IINA Remote">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>IINA Remote</title>
<style>
  :root { --bg: #fafafa; --fg: #18181b; --dim: #71717a; --line: #e4e4e7; --soft: #f0f0f2; --live: #16a34a; --off: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131315; --fg: #f4f4f5; --dim: #a1a1aa; --line: #2e2e33; --soft: #1f1f23; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { touch-action: manipulation; background: var(--bg); }
  body {
    margin: 0 auto; max-width: 520px; color: var(--fg); background: var(--bg);
    font: 15px/1.4 system-ui, sans-serif; -webkit-user-select: none; user-select: none;
    padding: max(16px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }
  header { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 14px; margin-bottom: 16px; }
  header::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
  body.offline header::before { background: var(--off); }
  body.offline main { opacity: .4; pointer-events: none; }
  #art { display: none; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 6px; margin-bottom: 16px; }
  body.art #art { display: block; }
  h1 { font-size: 20px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #subtitle { margin: 2px 0 0; color: var(--dim); min-height: 1.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  input[type=range] { width: 100%; margin: 0; accent-color: var(--fg); height: 24px; }
  #position { margin-top: 14px; }
  .times { display: flex; justify-content: space-between; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }

  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { opacity: .3; cursor: default; }
  .icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 8px; }
  .icon:hover:not(:disabled) { background: var(--soft); }
  .icon:active:not(:disabled) { background: var(--line); }
  svg { width: 24px; height: 24px; fill: currentColor; }
  .stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .transport { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; }
  .transport text { font: 700 7px system-ui, sans-serif; text-anchor: middle; }
  .transport .skip svg { width: 28px; height: 28px; }
  #play { width: 64px; height: 64px; border-radius: 50%; background: var(--fg); color: var(--bg); }
  #play:hover { background: var(--fg); opacity: .85; }
  #play svg { width: 30px; height: 30px; }
  .volume { display: flex; align-items: center; gap: 8px; }
  #volumeValue { min-width: 48px; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }

  nav { display: flex; border-bottom: 1px solid var(--line); margin-top: 20px; }
  nav button { flex: 1; padding: 12px 0 10px; color: var(--dim); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav button.on { color: var(--fg); border-color: var(--fg); }
  .panel { padding-top: 14px; }
  .panel[hidden] { display: none; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); margin: 14px 0 8px; }
  h2:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; font-variant-numeric: tabular-nums; }
  .chips button:hover { background: var(--soft); }
  .chips button.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { border: 1px solid var(--line); border-radius: 8px; min-width: 52px; height: 40px; font-variant-numeric: tabular-nums; }
  .stepper button:hover { background: var(--soft); }
  .stepper span { flex: 1; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }
  .list { display: flex; flex-direction: column; }
  .list button { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 8px; border-radius: 6px; text-align: left; }
  .list button:hover { background: var(--soft); }
  .list button.on { font-weight: 600; }
  .list .lead { width: 22px; color: var(--dim); font-variant-numeric: tabular-nums; font-weight: 400; }
  .list button.on .lead { color: var(--fg); }
  .list .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .meta { color: var(--dim); font-variant-numeric: tabular-nums; font-weight: 400; }
  .list progress { width: 56px; height: 4px; accent-color: var(--fg); }
  .empty { color: var(--dim); }
  [hidden] { display: none !important; }
</style>
</head>
<body class="offline">
<header id="mac">Connecting…</header>
<main>
  <img id="art" alt="">
  <h1 id="title">Nothing playing</h1>
  <p id="subtitle"></p>
  <div id="controls">
    <input id="position" type="range" min="0" max="1" step="1" value="0" aria-label="Position">
    <div class="times"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>
    <div class="transport">
      <button class="icon track" data-cmd="playlist-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M5 5h2.5v14H5zM20 5v14L9 12z"/></svg></button>
      <button class="icon skip" data-seek="-10" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path class="stroke" d="M12 4a8 8 0 1 1-8 8"/><path d="M8.5 4l4-2.6v5.2z"/><text x="12" y="15">10</text></svg></button>
      <button id="play" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path id="playIcon" d="M7 4.5l13 7.5-13 7.5z"/></svg></button>
      <button class="icon skip" data-seek="30" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24"><path class="stroke" d="M12 4a8 8 0 1 0 8 8"/><path d="M15.5 4l-4-2.6v5.2z"/><text x="12" y="15">30</text></svg></button>
      <button class="icon track" data-cmd="playlist-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16.5 5H19v14h-2.5zM4 5v14l11-7z"/></svg></button>
    </div>
    <div class="volume">
      <button class="icon" id="mute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path id="waves" class="stroke" d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path id="slash" class="stroke" d="M15 9l6 6M21 9l-6 6"/></svg></button>
      <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume">
      <span id="volumeValue"></span>
    </div>
  </div>

  <nav>
    <button data-tab="subtitles">Subtitles</button>
    <button data-tab="audio">Audio</button>
    <button data-tab="speed">Speed</button>
    <button data-tab="library">Up Next</button>
  </nav>
  <section class="panel" id="subtitles">
    <h2>Track</h2><div class="chips" id="sid"></div>
    <h2>Delay</h2><div class="stepper" data-prop="sub-delay" data-key="subDelay"></div>
  </section>
  <section class="panel" id="audio">
    <h2>Track</h2><div class="chips" id="aid"></div>
    <h2>Delay</h2><div class="stepper" data-prop="audio-delay" data-key="audioDelay"></div>
  </section>
  <section class="panel" id="speed"><div class="chips" id="speeds"></div></section>
  <section class="panel" id="library">
    <div id="playlistGroup"><h2>Playlist</h2><div class="list" id="playlist"></div></div>
    <div id="chaptersGroup"><h2>Chapters</h2><div class="list" id="chapters"></div></div>
    <div id="recentGroup"><h2>Recent</h2><div class="list" id="recent"></div></div>
    <p class="empty" id="nothing">Nothing up next.</p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const wsPort = location.hash.slice(1) || 8766;
const url = `ws://${location.hostname}:${wsPort}`;
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
const STEPS = [-1, -0.1, null, 0.1, 1];
let socket, s = null, lib = null, dragging = null, frame = 0;

function connect() {
  socket = new WebSocket(url);
  socket.binaryType = "arraybuffer";
  socket.onopen = () => document.body.classList.remove("offline");
  socket.onmessage = (e) => {
    const message = JSON.parse(new TextDecoder().decode(e.data));
    if (message.kind === "state") render(message);
    else if (message.kind === "library") renderLibrary(message);
  };
  socket.onclose = () => {
    document.body.classList.add("offline");
    $("mac").textContent = "Can’t reach IINA. Reconnecting…";
    setTimeout(connect, 1500);
  };
}
const send = (msg) => socket.readyState === WebSocket.OPEN && socket.send(JSON.stringify(msg));
const set = (prop, value) => send({ set: prop, value });
const seekBy = (seconds) => send({ cmd: "seek", args: [seconds, "relative"] });

function clock(t) {
  t = Math.max(0, Math.floor(t || 0));
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = String(t % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}

// Buttons are rebuilt only when their content changes, so taps aren't lost mid-render.
function buttons(container, items, build, onTap) {
  const key = JSON.stringify(items);
  if (container.dataset.key === key) return;
  container.dataset.key = key;
  container.replaceChildren(...items.map((item, index) => {
    const b = document.createElement("button");
    b.className = item.on ? "on" : "";
    build(b, item);
    b.onclick = () => onTap(item, index);
    return b;
  }));
}
const chip = (b, item) => (b.textContent = item.name);
function row(b, item) {
  b.innerHTML = '<span class="lead"></span><span class="name"></span>';
  b.firstChild.textContent = item.lead ?? "";
  b.lastChild.textContent = item.name;
  if (item.meta) b.insertAdjacentHTML("beforeend", `<span class="meta">${item.meta}</span>`);
  if (item.progress) b.insertAdjacentHTML("beforeend", `<progress max="1" value="${item.progress}"></progress>`);
}

function list(id, items, onTap) {
  $(`${id}Group`).hidden = !items.length;
  buttons($(id), items, row, onTap);
}

function renderLibrary(library) {
  lib = library;
  const current = s && s.chapter;
  list("playlist", lib.playlist.length > 1 ? lib.playlist.map((p, i) => ({ lead: i + 1, name: p.title, on: p.current })) : [],
    (_, i) => send({ cmd: "playlist-play-index", args: [i] }));
  list("chapters", lib.chapters.map((c, i) => ({ lead: i + 1, name: c.title || `Chapter ${i + 1}`, meta: clock(c.start), on: current === i })),
    (_, i) => send({ cmd: "chapter", args: [i] }));
  list("recent", lib.recent.map((r) => ({ name: r.title, url: r.url, progress: r.duration ? Math.min(1, r.progress / r.duration) : 0 })),
    (item) => send({ cmd: "open-recent", args: [item.url] }));
  $("nothing").hidden = lib.playlist.length > 1 || lib.chapters.length || lib.recent.length;
  document.querySelectorAll(".track").forEach((b) => (b.disabled = lib.playlist.length < 2));
  if (s) renderSubtitle();
}

function renderSubtitle() {
  const chapter = lib && lib.chapters[s.chapter];
  const position = lib && lib.playlist.length > 1 && s.playlistPos >= 0 ? `${s.playlistPos + 1} of ${lib.playlist.length}` : "";
  $("subtitle").textContent = chapter ? chapter.title || `Chapter ${s.chapter + 1}` : position;
}

function loadFrame() {
  if (!s.frame) return document.body.classList.remove("art");
  if (s.frame === frame) return;
  frame = s.frame;
  const image = new Image();
  image.onload = () => {
    if (frame !== s.frame) return;
    $("art").src = image.src;
    document.body.classList.add("art");
  };
  image.src = `/frame/${wsPort}.jpg?${frame}`;
}

const tracks = (type, current, off) => (off ? [{ id: "no", name: "Off", on: current === "no" }] : []).concat(
  s.tracks.filter((t) => t.type === type).map((t) => ({
    id: String(t.id), name: [t.title, t.lang.toUpperCase()].filter(Boolean).join(" · ") || `Track ${t.id}`, on: String(t.id) === current,
  })));

function render(next) {
  const chapterChanged = !s || s.chapter !== next.chapter;
  s = next;
  $("mac").textContent = s.host || location.hostname;
  $("title").textContent = s.title || "Nothing playing";
  $("controls").hidden = !s.title;
  renderSubtitle();
  loadFrame();
  $("playIcon").setAttribute("d", s.pause ? "M7 4.5l13 7.5-13 7.5z" : "M6 4h4v16H6zM14 4h4v16h-4z");
  const position = $("position");
  position.max = Math.max(1, Math.floor(s.duration));
  if (dragging !== position) position.value = s.time;
  $("elapsed").textContent = clock(+position.value);
  $("remaining").textContent = "-" + clock(s.duration - position.value);
  const volume = $("volume");
  volume.max = s.volumeMax;
  if (dragging !== volume) volume.value = s.volume;
  $("volumeValue").textContent = s.mute ? "Muted" : `${Math.round(volume.value)}%`;
  $("waves").style.display = s.mute ? "none" : "";
  $("slash").style.display = s.mute ? "" : "none";
  buttons($("aid"), tracks("audio", s.aid), chip, (item) => set("aid", item.id));
  buttons($("sid"), tracks("sub", s.subVisible ? s.sid : "no", true), chip, (item) => {
    if (item.id !== "no") set("sid", item.id);
    set("sub-visibility", item.id !== "no");
  });
  buttons($("speeds"), SPEEDS.map((speed) => ({ name: `${speed}×`, speed, on: Math.abs(speed - s.speed) < 0.001 })), chip,
    (item) => set("speed", item.speed));
  document.querySelectorAll(".stepper span").forEach((span) => {
    span.textContent = `${(s[span.parentNode.dataset.key] || 0).toFixed(1)} s`;
  });
  if (chapterChanged && lib) renderLibrary(lib);
}

for (const stepper of document.querySelectorAll(".stepper")) {
  for (const step of STEPS) {
    if (step === null) { stepper.append(document.createElement("span")); continue; }
    const b = document.createElement("button");
    b.textContent = `${step > 0 ? "+" : "−"}${Math.abs(step)}`;
    b.setAttribute("aria-label", `${step > 0 ? "+" : "-"}${Math.abs(step)} seconds`);
    b.onclick = () => set(stepper.dataset.prop, Math.round(((s[stepper.dataset.key] || 0) + step) * 10) / 10);
    stepper.append(b);
  }
}

function showTab(name) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll(".panel").forEach((p) => (p.hidden = p.id !== name));
  try { localStorage.setItem("tab", name); } catch {}
}
document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));
let saved = null;
try { saved = localStorage.getItem("tab"); } catch {}
showTab($(saved) ? saved : "subtitles");

$("play").onclick = () => set("pause", !s.pause);
$("mute").onclick = () => set("mute", !s.mute);
document.querySelectorAll("[data-cmd]").forEach((b) => (b.onclick = () => send({ cmd: b.dataset.cmd })));
document.querySelectorAll("[data-seek]").forEach((b) => (b.onclick = () => seekBy(+b.dataset.seek)));

for (const [range, onInput, onCommit] of [
  [$("position"), (el) => ($("elapsed").textContent = clock(+el.value)), (el) => send({ cmd: "seek", args: [+el.value, "absolute"] })],
  [$("volume"), (el) => { $("volumeValue").textContent = `${el.value}%`; set("volume", +el.value); }, () => {}],
]) {
  range.oninput = () => { dragging = range; onInput(range); };
  range.onchange = () => { onCommit(range); dragging = null; };
}

document.onkeydown = (e) => {
  if (!s || e.metaKey || e.ctrlKey || e.target.tagName === "INPUT" || (e.target.tagName === "BUTTON" && e.key === " ")) return;
  const keys = {
    " ": () => set("pause", !s.pause),
    ArrowLeft: () => seekBy(-10),
    ArrowRight: () => seekBy(30),
    ArrowUp: () => set("volume", Math.min(s.volumeMax, s.volume + 5)),
    ArrowDown: () => set("volume", Math.max(0, s.volume - 5)),
    m: () => set("mute", !s.mute),
  };
  if (!keys[e.key]) return;
  e.preventDefault();
  keys[e.key]();
};

connect();
</script>
</body>
</html>
