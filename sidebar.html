<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  body { margin: 0; padding: 20px 16px; font: 13px -apple-system, system-ui, sans-serif; text-align: center; }
  img { width: 100%; max-width: 220px; aspect-ratio: 1; image-rendering: pixelated; border: 10px solid #fff; border-radius: 8px; box-sizing: border-box; }
  p { margin: 12px 0 4px; }
  small { opacity: .6; user-select: text; word-break: break-all; }
</style>
</head>
<body>
<img id="qr" alt="QR code">
<p>Scan with your phone's camera to open the remote, or use the IINA Remote app.</p>
<small id="url"></small>
<script>
  iina.onMessage("qr", ({ url, png }) => {
    document.getElementById("qr").src = `data:image/png;base64,${png}`;
    document.getElementById("url").textContent = url;
  });
  iina.postMessage("ready", {});
</script>
</body>
</html>
