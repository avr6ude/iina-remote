<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IINA Remote">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>IINA Remote</title>
<style>
  :root { --page: #eceef1; --card: #fff; --ink: #1f2228; --muted: #8b9099; --line: #dfe2e6; --well: #d3d6db; --well-ink: #1f2228; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #1b1d21; --card: #44474f; --ink: #fff; --muted: #b3b6bd; --line: #5c6069; --well: #fff; --well-ink: #1f2228; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { touch-action: manipulation; background: var(--page); }
  body {
    display: flex; flex-direction: column; gap: 16px; max-width: 420px; min-height: 100dvh; margin: 0 auto; color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }
  .card { background: var(--card); border-radius: 18px; padding: 22px; }
  body.offline .player { opacity: .5; pointer-events: none; }
  h1 { font-size: 16px; font-weight: 700; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #subtitle { font-size: 12px; color: var(--muted); margin: 3px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { opacity: .3; cursor: default; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  svg { display: block; width: 22px; height: 22px; fill: currentColor; }
  .tap { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; }
  .tap:active:not(:disabled) { background: var(--line); }

  .stage { display: flex; justify-content: center; align-items: center; gap: 32px; margin: 30px 0 26px; }
  #play { width: 72px; height: 72px; border-radius: 50%; background: var(--well); color: var(--well-ink); display: grid; place-items: center; transition: transform .15s; }
  #play:active { transform: scale(.94); }
  #play svg { width: 30px; height: 30px; }

  input[type=range] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 20px; margin: 0; background: none; --p: 0%; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, var(--ink) var(--p), var(--line) var(--p)); }
  input[type=range]::-moz-range-track { height: 2px; background: linear-gradient(90deg, var(--ink) var(--p), var(--line) var(--p)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; border-radius: 50%; background: var(--ink); }
  input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border: 0; border-radius: 50%; background: var(--ink); }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .tools { display: flex; justify-content: space-between; align-items: center; margin: 14px -10px -8px; }
  .tools .tap.on { background: var(--ink); color: var(--card); }
  #speedButton { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .volume { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--muted); }
  .volume .tap { width: 32px; height: 32px; margin-left: -6px; }
  .volume svg { width: 18px; height: 18px; }

  h2 { font-size: 14px; font-weight: 700; margin: 0 0 12px; }
  h3 { font-size: 12px; font-weight: 400; color: var(--muted); margin: 16px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { min-height: 34px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .chips button.on { background: var(--ink); border-color: var(--ink); color: var(--card); font-weight: 600; }
  .stepper { display: flex; align-items: center; justify-content: space-between; }
  .stepper button { min-width: 48px; height: 34px; border-radius: 99px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .stepper button:active { background: var(--line); }
  .stepper span { font-weight: 700; font-variant-numeric: tabular-nums; }
  .list button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; text-align: left; border-top: 1px solid var(--line); }
  .list button:first-child { border-top: 0; }
  .list .lead { width: 18px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .list .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .list button.on { font-weight: 700; }
  .list button.on .lead { color: var(--ink); }
  .list progress { width: 48px; height: 3px; accent-color: var(--ink); }
  .empty { color: var(--muted); margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="offline">
<section class="card player">
  <h1 id="title">Connecting…</h1>
  <p id="subtitle"></p>
  <div id="controls">
    <div class="stage">
      <button class="tap track" data-cmd="playlist-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="play" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg></button>
      <button class="tap track" data-cmd="playlist-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
    <input id="position" type="range" min="0" max="1" step="1" value="0" aria-label="Position">
    <div class="times"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>
    <div class="volume">
      <button class="tap" id="mute" aria-label="Mute"><svg viewBox="0 0 24 24"><path id="muteIcon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
      <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume">
    </div>
    <div class="tools">
      <button class="tap" data-seek="-10" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8zm-1.1 11h-.85v-3.26l-1.01.31v-.69l1.77-.63h.09V16zm4.28-1.76c0 .32-.03.6-.1.82s-.17.42-.29.57-.28.26-.45.33-.37.1-.59.1-.41-.03-.59-.1-.33-.18-.46-.33-.23-.34-.3-.57-.11-.5-.11-.82v-.74c0-.32.03-.6.1-.82s.17-.42.29-.57.28-.26.45-.33.37-.1.59-.1.41.03.59.1.33.18.46.33.23.34.3.57.11.5.11.82v.74zm-.85-.86c0-.19-.01-.35-.04-.48s-.07-.23-.12-.31-.11-.14-.19-.17-.16-.05-.25-.05-.18.02-.25.05-.14.09-.19.17-.09.18-.12.31-.04.29-.04.48v.97c0 .19.01.35.04.48s.07.24.12.32.11.14.19.17.16.05.25.05.18-.02.25-.05.14-.09.19-.17.09-.19.11-.32.04-.29.04-.48v-.97z"/></svg></button>
      <button class="tap" data-panel="subtitles" aria-label="Subtitles"><svg viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/></svg></button>
      <button class="tap" data-panel="audio" aria-label="Audio"><svg viewBox="0 0 24 24"><path d="M7 18h2V6H7v12zm4 4h2V2h-2v20zm-8-8h2v-4H3v4zm12 4h2V6h-2v12zm4-8v4h2v-4h-2z"/></svg></button>
      <button class="tap" data-panel="speed" id="speedButton" aria-label="Speed">1×</button>
      <button class="tap" data-panel="library" aria-label="Up next"><svg viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg></button>
      <button class="tap" data-seek="30" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24"><path d="M9.6 13.5h.4c.2 0 .4-.1.5-.2s.2-.2.2-.4v-.2s-.1-.1-.1-.2-.1-.1-.2-.1h-.5s-.1.1-.2.1-.1.1-.1.2v.2h-1c0-.2 0-.3.1-.5s.2-.3.3-.4.3-.2.4-.2.4-.1.5-.1c.2 0 .4 0 .6.1s.3.1.5.2.2.2.3.4.1.3.1.5v.3s-.1.2-.1.3-.1.2-.2.2-.2.1-.3.2c.2.1.4.2.5.4s.2.4.2.6c0 .2 0 .4-.1.5s-.2.3-.3.4-.3.2-.5.2-.4.1-.6.1c-.2 0-.4 0-.5-.1s-.3-.1-.5-.2-.2-.2-.3-.4-.1-.4-.1-.6h.8v.2s.1.1.1.2.1.1.2.1h.5s.1-.1.2-.1.1-.1.1-.2v-.5s-.1-.1-.1-.2-.1-.1-.2-.1h-.6v-.7zm5.7.7c0 .3 0 .6-.1.8l-.3.6s-.3.3-.5.3-.4.1-.6.1-.4 0-.6-.1-.3-.2-.5-.3-.2-.3-.3-.6-.1-.5-.1-.8v-.7c0-.3 0-.6.1-.8l.3-.6s.3-.3.5-.3.4-.1.6-.1.4 0 .6.1.3.2.5.3.2.3.3.6.1.5.1.8v.7zm-.9-.8v-.5s-.1-.2-.1-.3-.1-.1-.2-.2-.2-.1-.3-.1-.2 0-.3.1l-.2.2s-.1.2-.1.3v2s.1.2.1.3.1.1.2.2.2.1.3.1.2 0 .3-.1l.2-.2s.1-.2.1-.3v-1.5zM4 13c0 4.4 3.6 8 8 8s8-3.6 8-8h-2c0 3.3-2.7 6-6 6s-6-2.7-6-6 2.7-6 6-6v4l5-5-5-5v4c-4.4 0-8 3.6-8 8z"/></svg></button>
    </div>
  </div>
</section>

<section class="card panel" id="subtitles" hidden>
  <h2>Subtitles</h2>
  <div class="chips" id="sid"></div>
  <h3>Delay</h3><div class="stepper" data-prop="sub-delay" data-key="subDelay"></div>
</section>
<section class="card panel" id="audio" hidden>
  <h2>Audio</h2>
  <div class="chips" id="aid"></div>
  <h3>Delay</h3><div class="stepper" data-prop="audio-delay" data-key="audioDelay"></div>
</section>
<section class="card panel" id="speed" hidden>
  <h2>Speed</h2>
  <div class="chips" id="speeds"></div>
</section>
<section class="card panel" id="library" hidden>
  <div id="playlistGroup"><h2>Playlist</h2><div class="list" id="playlist"></div></div>
  <div id="chaptersGroup"><h3>Chapters</h3><div class="list" id="chapters"></div></div>
  <div id="recentGroup"><h3>Recently played</h3><div class="list" id="recent"></div></div>
  <p class="empty" id="nothing">No playlist, chapters or recent files yet.</p>
</section>

<script>
const $ = (id) => document.getElementById(id);
const wsPort = location.hash.slice(1) || 8766;
const url = `ws://${location.hostname}:${wsPort}`;
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
const STEPS = [-1, -0.1, null, 0.1, 1];
const UNMUTED = $("muteIcon").getAttribute("d");
const MUTED = "M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z";
let socket, s = null, lib = null, dragging = null;

function connect() {
  socket = new WebSocket(url);
  socket.binaryType = "arraybuffer";
  socket.onopen = () => document.body.classList.remove("offline");
  socket.onmessage = (e) => {
    const message = JSON.parse(new TextDecoder().decode(e.data));
    if (message.kind === "state") render(message);
    else if (message.kind === "library") renderLibrary(message);
  };
  socket.onclose = () => {
    document.body.classList.add("offline");
    $("title").textContent = "Can’t reach IINA";
    $("subtitle").textContent = "Reconnecting…";
    setTimeout(connect, 1500);
  };
}
const send = (msg) => socket.readyState === WebSocket.OPEN && socket.send(JSON.stringify(msg));
const set = (prop, value) => send({ set: prop, value });
const seekBy = (seconds) => send({ cmd: "seek", args: [seconds, "relative"] });

function clock(t) {
  t = Math.max(0, Math.floor(t || 0));
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = String(t % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}

function fill(range, value) {
  range.value = value;
  range.style.setProperty("--p", `${(100 * (range.value - range.min)) / (range.max - range.min || 1)}%`);
}

// Buttons are rebuilt only when their content changes, so taps aren't lost mid-render.
function buttons(container, items, build, onTap) {
  const key = JSON.stringify(items);
  if (container.dataset.key === key) return;
  container.dataset.key = key;
  container.replaceChildren(...items.map((item, index) => {
    const b = document.createElement("button");
    b.className = item.on ? "on" : "";
    build(b, item);
    b.onclick = () => onTap(item, index);
    return b;
  }));
}
const chip = (b, item) => (b.textContent = item.name);
function row(b, item) {
  b.innerHTML = '<span class="lead"></span><span class="name"></span>';
  b.firstChild.textContent = item.lead ?? "";
  b.lastChild.textContent = item.name;
  if (item.meta) b.insertAdjacentHTML("beforeend", `<span class="meta">${item.meta}</span>`);
  if (item.progress) b.insertAdjacentHTML("beforeend", `<progress max="1" value="${item.progress}"></progress>`);
}

function list(id, items, onTap) {
  $(`${id}Group`).hidden = !items.length;
  buttons($(id), items, row, onTap);
}

function renderLibrary(library) {
  lib = library;
  const current = s && s.chapter;
  list("playlist", lib.playlist.length > 1 ? lib.playlist.map((p, i) => ({ lead: i + 1, name: p.title, on: p.current })) : [],
    (_, i) => send({ cmd: "playlist-play-index", args: [i] }));
  list("chapters", lib.chapters.map((c, i) => ({ lead: i + 1, name: c.title || `Chapter ${i + 1}`, meta: clock(c.start), on: current === i })),
    (_, i) => send({ cmd: "chapter", args: [i] }));
  list("recent", lib.recent.map((r) => ({ name: r.title, url: r.url, progress: r.duration ? Math.min(1, r.progress / r.duration) : 0 })),
    (item) => send({ cmd: "open-recent", args: [item.url] }));
  $("nothing").hidden = lib.playlist.length > 1 || lib.chapters.length || lib.recent.length;
  document.querySelectorAll(".track").forEach((b) => (b.disabled = lib.playlist.length < 2));
  if (s) renderSubtitle();
}

function renderSubtitle() {
  const chapter = lib && lib.chapters[s.chapter];
  $("subtitle").textContent = chapter ? `${s.host} – ${chapter.title || `Chapter ${s.chapter + 1}`}` : s.host || location.hostname;
}

const tracks = (type, current, off) => (off ? [{ id: "no", name: "Off", on: current === "no" }] : []).concat(
  s.tracks.filter((t) => t.type === type).map((t) => ({
    id: String(t.id), name: [t.title, t.lang.toUpperCase()].filter(Boolean).join(", ") || `Track ${t.id}`, on: String(t.id) === current,
  })));

function render(next) {
  const chapterChanged = !s || s.chapter !== next.chapter;
  s = next;
  $("title").textContent = s.title || "Nothing playing";
  $("controls").hidden = !s.title;
  renderSubtitle();
  $("playIcon").setAttribute("d", s.pause ? "M8 5v14l11-7z" : "M6 19h4V5H6v14zm8-14v14h4V5h-4z");
  const position = $("position");
  position.max = Math.max(1, Math.floor(s.duration));
  if (dragging !== position) fill(position, s.time);
  $("elapsed").textContent = clock(+position.value);
  $("remaining").textContent = "-" + clock(s.duration - position.value);
  const volume = $("volume");
  volume.max = s.volumeMax;
  if (dragging !== volume) fill(volume, s.volume);
  $("muteIcon").setAttribute("d", s.mute ? MUTED : UNMUTED);
  $("speedButton").textContent = `${s.speed}×`;
  buttons($("aid"), tracks("audio", s.aid), chip, (item) => set("aid", item.id));
  buttons($("sid"), tracks("sub", s.subVisible ? s.sid : "no", true), chip, (item) => {
    if (item.id !== "no") set("sid", item.id);
    set("sub-visibility", item.id !== "no");
  });
  buttons($("speeds"), SPEEDS.map((speed) => ({ name: `${speed}×`, speed, on: Math.abs(speed - s.speed) < 0.001 })), chip,
    (item) => set("speed", item.speed));
  document.querySelectorAll(".stepper span").forEach((span) => {
    span.textContent = `${(s[span.parentNode.dataset.key] || 0).toFixed(1)} s`;
  });
  if (chapterChanged && lib) renderLibrary(lib);
}

for (const stepper of document.querySelectorAll(".stepper")) {
  for (const step of STEPS) {
    if (step === null) { stepper.append(document.createElement("span")); continue; }
    const b = document.createElement("button");
    b.textContent = `${step > 0 ? "+" : "−"}${Math.abs(step)}`;
    b.setAttribute("aria-label", `${step > 0 ? "Later" : "Earlier"} by ${Math.abs(step)} seconds`);
    b.onclick = () => set(stepper.dataset.prop, Math.round(((s[stepper.dataset.key] || 0) + step) * 10) / 10);
    stepper.append(b);
  }
}

// The tool buttons open one panel at a time under the player; tapping the open one closes it.
function showPanel(name) {
  document.querySelectorAll("[data-panel]").forEach((b) => b.classList.toggle("on", b.dataset.panel === name));
  document.querySelectorAll(".panel").forEach((p) => (p.hidden = p.id !== name));
}
document.querySelectorAll("[data-panel]").forEach((b) => (b.onclick = () => showPanel(b.classList.contains("on") ? null : b.dataset.panel)));

$("play").onclick = () => set("pause", !s.pause);
$("mute").onclick = () => set("mute", !s.mute);
document.querySelectorAll("[data-cmd]").forEach((b) => (b.onclick = () => send({ cmd: b.dataset.cmd })));
document.querySelectorAll("[data-seek]").forEach((b) => (b.onclick = () => seekBy(+b.dataset.seek)));

for (const [range, onInput, onCommit] of [
  [$("position"), (el) => ($("elapsed").textContent = clock(+el.value)), (el) => send({ cmd: "seek", args: [+el.value, "absolute"] })],
  [$("volume"), (el) => set("volume", +el.value), () => {}],
]) {
  range.oninput = () => { dragging = range; fill(range, range.value); onInput(range); };
  range.onchange = () => { onCommit(range); dragging = null; };
}

document.onkeydown = (e) => {
  if (!s || e.metaKey || e.ctrlKey || e.target.tagName === "INPUT" || (e.target.tagName === "BUTTON" && e.key === " ")) return;
  const keys = {
    " ": () => set("pause", !s.pause),
    ArrowLeft: () => seekBy(-10),
    ArrowRight: () => seekBy(30),
    ArrowUp: () => set("volume", Math.min(s.volumeMax, s.volume + 5)),
    ArrowDown: () => set("volume", Math.max(0, s.volume - 5)),
    m: () => set("mute", !s.mute),
  };
  if (!keys[e.key]) return;
  e.preventDefault();
  keys[e.key]();
};

connect();
</script>
</body>
</html>
